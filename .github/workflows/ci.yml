name: Dart CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.3.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test example
        if: matrix.sdk == 'stable'
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run example/genetic_engine_example.dart
      - run: dart run example/minimize.dart
      - run: dart run example/custom_mutation.dart
      - run: dart pub publish --dry-run
