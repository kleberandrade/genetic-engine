name: Dart CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.3.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test example tool
        if: matrix.sdk == 'stable'
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart run example/genetic_engine_example.dart
      - run: dart run example/minimize.dart
      - run: dart run example/custom_mutation.dart
      - run: dart run example/travelling_salesman.dart
      - run: dart pub publish --dry-run

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create validated source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "doc/releases/${GITHUB_REF_NAME#v}.md"
          fi
